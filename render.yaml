services:
  - type: web
    name: gamigion-wp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CRED_ENCRYPTION_KEY
        sync: false
      - key: SOURCE_URL
        value: https://www.gamigion.com/
      - key: SCRAPE_CRON
        value: 0 * * * *
      - key: SCRAPE_CRON_ENABLED
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: gamigion-wp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
